name: Validate agent-vm

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: '2026.10.24'
      - name: Test updater
        run: just check
      - name: Validate bottle installation and removal
        run: uv run --locked python scripts/update-package.py agent-vm --validate-only
