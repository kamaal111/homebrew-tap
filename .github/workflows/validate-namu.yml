name: Validate Namu

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: '2026.10.24'
      - name: Test shared bottle tooling
        run: just check
      - name: Configure Homebrew
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          fi
      - name: Validate native macOS bottle installation
        if: runner.os == 'macOS'
        run: uv run --locked python scripts/namu-bottle.py
      - name: Register validation tap
        run: |
          brew tap --custom-remote namu/validation "$GITHUB_WORKSPACE"
          brew trust --formula namu/validation/namu
      - name: Validate formula style
        run: |
          ruby -c Formula/namu.rb
          brew style --formula namu/validation/namu
      - name: Install and test Namu
        run: |
          brew install namu/validation/namu
          brew test namu/validation/namu
          namu --version
          namu --help
          brew uninstall namu/validation/namu
          test ! -e "$(brew --prefix)/bin/namu"
          test ! -L "$(brew --prefix)/bin/namu"
          brew untap namu/validation

  rehearse-updater:
    strategy:
      fail-fast: false
      matrix:
        package: [namu, agent-vm]
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: '2026.10.24'
      - name: Test updater
        run: just check
      - name: Rehearse package update without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/update-package.py "$RELEASE_PACKAGE" --dry-run --output-dir "$RUNNER_TEMP/package-rehearsal"
      - name: Test suite against generated formula
        run: |
          cp "$RUNNER_TEMP/package-rehearsal/$RELEASE_PACKAGE.rb" "Formula/$RELEASE_PACKAGE.rb"
          just check
      - name: Retain candidate formula and verification report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-update-rehearsal
          path: |
            ${{ runner.temp }}/package-rehearsal/${{ matrix.package }}.rb
            ${{ runner.temp }}/package-rehearsal/report.json
          if-no-files-found: error
