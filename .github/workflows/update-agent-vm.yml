name: Update agent-vm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable release tag, e.g. v0.1.0 (empty: latest stable)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-agent-vm
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: '2026.10.24'
      - name: Test updater
        run: just check
      - name: Validate release and propose formula PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh auth setup-git
          uv run --locked python scripts/update-package.py agent-vm --version "$RELEASE_VERSION"
